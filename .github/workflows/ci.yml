name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Unit projects only — the integration project hits a real Supabase DB and
      # is intentionally excluded from CI (run it locally / in a gated job).
      - name: Unit tests (frontend + backend)
        run: npm run test:unit

      # Report-only for now: a hard gate (--audit-level=high) would red the build
      # until the flagged runtime deps are remediated. Dependabot (.github/
      # dependabot.yml) opens the fix PRs; flip this to blocking once green.
      - name: Dependency audit (report-only)
        run: npm audit --omit=dev || true
