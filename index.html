<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Essential Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Route metadata is injected by the post-build generator and managed at runtime by RouteSeo. -->
  <!-- route-seo-head -->
  <meta name="author" content="Jetsetters Corporation">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/images/jetset.jpeg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/jetset.jpeg">

  <!-- Stable social account references -->
  <meta name="twitter:creator" content="@jetsetters">
  <meta name="twitter:site" content="@jetsetters">

  <!-- Additional App Meta Tags -->
  <meta name="theme-color" content="#055B75">
  <meta name="msapplication-TileColor" content="#055B75">
  <meta name="msapplication-TileImage" content="/images/jetset.jpeg">
  <meta name="application-name" content="Jetsetters">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jetsetters">
  <meta name="format-detection" content="telephone=no">

  <!-- Geo Tags -->
  <meta name="geo.region" content="US">
  <meta name="geo.placename" content="United States">

  <!-- Preconnect to External Domains for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.amadeus.com">
  <link rel="preconnect" href="https://qqmagqwumjipdqvxbiqu.supabase.co">

  <!-- Brand fonts: Lato (primary) + Inter (secondary/fallback). Single two-font system, used site-wide. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap">

  <!-- DNS Prefetch -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://api.amadeus.com">
</head>

<body>
  <div id="app"></div>
  <script type="module" src="./frontend/main.jsx"></script>
</body>

</html>
