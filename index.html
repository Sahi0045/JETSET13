<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Essential Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Route metadata is injected by the post-build generator and managed at runtime by RouteSeo. -->
  <!-- route-seo-head -->
  <meta name="author" content="Jetsetters Corporation">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/images/jetset.jpeg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/jetset.jpeg">

  <!-- Stable social account references -->
  <meta name="twitter:creator" content="@jetsetters">
  <meta name="twitter:site" content="@jetsetters">

  <!-- Additional App Meta Tags -->
  <meta name="theme-color" content="#055B75">
  <meta name="msapplication-TileColor" content="#055B75">
  <meta name="msapplication-TileImage" content="/images/jetset.jpeg">
  <meta name="application-name" content="Jetsetters">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jetsetters">
  <meta name="format-detection" content="telephone=no">

  <!-- Geo Tags -->
  <meta name="geo.region" content="US">
  <meta name="geo.placename" content="United States">

  <!-- Preconnect to External Domains for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://qqmagqwumjipdqvxbiqu.supabase.co">

  <!--
    Brand fonts: Lato (primary) + Inter (secondary/fallback). Single two-font
    system, used site-wide.

    Loaded without blocking render. As a plain stylesheet this cost the first
    paint a full round trip to fonts.googleapis.com — on a slow connection the
    page stayed blank for seconds while the boot shell below sat parsed and
    ready to draw. `media="print"` makes the browser fetch it at normal priority
    but not block on it; the onload handler promotes it to `all` once it lands.
    The URL already carries `display=swap`, so text was always going to paint in
    a fallback face first — this just lets that happen sooner.
  -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap">
  </noscript>

  <!--
    Boot shell: a static, JS-free skeleton of the home hero.

    It exists because the first paint used to be a full-screen spinner rendered
    by React's Suspense fallback, which meant the page stayed on
    "Preparing your journey..." for as long as the route chunk took to arrive —
    seconds on a slow connection, and long enough that a JS-rendering crawler or
    social-preview bot could snapshot the spinner as the page's main content.

    This markup ships in the initial HTML payload, so it paints before any
    script runs. Its styles are inlined for the same reason: a <link> stylesheet
    would be one more render-blocking round trip. `frontend/src/app.jsx` removes
    the shell the moment the real route has rendered.
  -->
  <style>
    #boot-shell {
      position: fixed;
      inset: 0;
      z-index: 999;
      overflow: hidden;
      background: #FBF9F4;
      font-family: 'Lato', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: #0C2A33;
    }
    #boot-shell .bs-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.15rem clamp(1rem, 4vw, 3rem);
      border-bottom: 1px solid rgba(12, 42, 51, 0.07);
    }
    #boot-shell .bs-logo { width: 132px; height: 30px; border-radius: 6px; }
    #boot-shell .bs-navlinks { display: flex; gap: 1.5rem; }
    #boot-shell .bs-navlinks i { display: block; width: 62px; height: 11px; border-radius: 4px; }
    #boot-shell .bs-hero {
      max-width: 66rem;
      margin: 0 auto;
      padding: clamp(2rem, 6vh, 4.5rem) 1.25rem 0;
      text-align: center;
    }
    #boot-shell .bs-kicker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.35rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-weight: 700;
      font-size: 0.95rem;
      color: #055B75;
    }
    #boot-shell .bs-rule {
      width: 3.5rem;
      height: 1px;
      background: linear-gradient(90deg, rgba(5, 91, 117, 0), rgba(5, 91, 117, 0.55));
    }
    #boot-shell .bs-rule-r { transform: rotate(180deg); }
    #boot-shell .bs-h1 {
      font-weight: 600;
      line-height: 1.15;
      font-size: clamp(2.4rem, 6.4vw, 5rem);
    }
    #boot-shell .bs-h1 em { font-style: normal; color: #055B75; }
    #boot-shell .bs-sub {
      max-width: 36rem;
      margin: 2rem auto 0;
      font-size: 1.06rem;
      line-height: 1.65;
      color: #52525B;
    }
    #boot-shell .bs-card {
      margin: 2.75rem auto 0;
      max-width: 64rem;
      background: #fff;
      border: 1px solid rgba(12, 42, 51, 0.07);
      border-radius: 16px;
      box-shadow: 0 18px 44px -28px rgba(12, 42, 51, 0.45);
      padding: 1.4rem;
    }
    #boot-shell .bs-tabs { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; }
    #boot-shell .bs-tabs i { display: block; width: 88px; height: 32px; border-radius: 999px; }
    #boot-shell .bs-fields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
    #boot-shell .bs-fields i { display: block; height: 54px; border-radius: 10px; }
    #boot-shell .bs-cta { height: 50px; width: 190px; margin: 1.25rem auto 0; border-radius: 999px; }
    #boot-shell .bs-secure { margin-top: 2rem; font-size: 0.875rem; color: rgba(12, 42, 51, 0.6); }
    #boot-shell .bs-sk {
      background: linear-gradient(90deg, #ECE7DC 25%, #F6F2E9 37%, #ECE7DC 63%);
      background-size: 220% 100%;
      animation: bs-shimmer 1.5s linear infinite;
    }
    @keyframes bs-shimmer { from { background-position: 220% 0; } to { background-position: -220% 0; } }
    @media (max-width: 860px) {
      #boot-shell .bs-navlinks { display: none; }
      #boot-shell .bs-fields { grid-template-columns: repeat(2, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-shell .bs-sk { animation: none; }
    }
  </style>

  <!-- DNS Prefetch -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
</head>

<body>
  <div id="app">
    <!-- route-seo-body -->
  </div>

  <!-- Hidden from assistive tech and crawlers: it duplicates the hero that the
       real app renders a moment later, and the indexable copy lives in #app. -->
  <div id="boot-shell" aria-hidden="true">
    <div class="bs-nav">
      <div class="bs-logo bs-sk"></div>
      <div class="bs-navlinks"><i class="bs-sk"></i><i class="bs-sk"></i><i class="bs-sk"></i><i class="bs-sk"></i></div>
    </div>
    <div class="bs-hero">
      <div class="bs-kicker">
        <span class="bs-rule"></span>
        <span>Luxury Travel, Effortlessly Planned</span>
        <span class="bs-rule bs-rule-r"></span>
      </div>
      <div class="bs-h1">Find Your <em>Perfect Flight</em><br>Today</div>
      <p class="bs-sub">Handpicked fares, real human concierges, and a best-price promise &mdash; book with confidence and travel with peace of mind.</p>
      <div class="bs-card">
        <div class="bs-tabs"><i class="bs-sk"></i><i class="bs-sk"></i><i class="bs-sk"></i></div>
        <div class="bs-fields"><i class="bs-sk"></i><i class="bs-sk"></i><i class="bs-sk"></i><i class="bs-sk"></i></div>
        <div class="bs-cta bs-sk"></div>
      </div>
      <div class="bs-secure">Secure checkout &middot; SSL encrypted</div>
    </div>
  </div>

  <!-- Without JS the shell would cover the prerendered content forever. -->
  <noscript><style>#boot-shell { display: none; }</style></noscript>

  <script type="module" src="./frontend/main.jsx"></script>
</body>

</html>
