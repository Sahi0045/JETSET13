<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page Not Found | Jetsetters</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #f1fbfd;
        color: #034457;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 1.5rem;
      }
      main {
        background: #fff;
        border-radius: 1rem;
        box-shadow: 0 16px 40px rgba(5, 91, 117, 0.14);
        max-width: 34rem;
        padding: 3rem 2rem;
        text-align: center;
      }
      h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 0.5rem; }
      p { color: #4b5563; font-size: 1.0625rem; line-height: 1.6; margin: 0 0 1.75rem; }
      a {
        background: #055b75;
        border-radius: 0.5rem;
        color: #fff;
        display: inline-block;
        font-weight: 700;
        padding: 0.85rem 1.25rem;
        text-decoration: none;
      }
      a:hover, a:focus { background: #034457; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or may have moved.</p>
      <a href="/">Return to Jetsetters home</a>
    </main>
  </body>
</html>
